name: Deploy to OVH

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ovh
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Write SSH key
        run: |
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Pull, build and restart
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} <<'EOF'
            set -euo pipefail
            cd /opt/artist-outreach
            git fetch --all --prune
            git reset --hard origin/main
            docker compose pull || true
            docker compose up -d --build --remove-orphans
            docker compose exec -T app node node_modules/prisma/build/index.js migrate deploy --schema=prisma/schema.prisma
            docker image prune -f
          EOF

      - name: Wait for /api/health
        run: |
          for i in {1..30}; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://${{ secrets.APP_DOMAIN }}/api/health || echo 000)
            echo "attempt $i: $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "health check no returned 200 in 150s"
          exit 1
